<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheriff Tornillo · El Laberinto del Oro</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../juego.css">
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js" } }</script>
</head>
<body class="laberinto">
<canvas id="lienzo" tabindex="0" aria-label="Juego: El Laberinto del Oro"></canvas>

<div class="hud" id="hud">
  <div class="tarjeta izq">
    <svg class="moneda-ic" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#f9c33b" stroke="#a87a14" stroke-width="2"/><path d="M10.5 9v7a4.5 4.5 0 0 0 9 0V9" fill="none" stroke="#8a5f0c" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div><small>PUNTAJE</small><b id="puntaje">0000</b></div>
  </div>
  <div class="centro">
    <div class="titulo">SHERIFF TORNILLO</div>
    <div class="estado-puerta" id="puerta">PUERTA CERRADA · faltan 36</div>
  </div>
  <div class="tarjeta der">
    <div><small>PUNTOS RESTANTES</small><b><span id="restantes">36</span> / <span id="total">36</span></b>
      <div class="barra"><i id="barra"></i></div></div>
  </div>
</div>

<div class="ayuda" id="ayuda">FLECHAS mover · R reiniciar · L rayos y rutas · V vista · M música · F1 info</div>
<div class="info" id="info" hidden></div>
<div class="vineta" id="vineta"></div>

<div class="cartel" id="carga"><div class="carta"><div class="ruleta"></div><h2>Cargando…</h2><p id="cargaTxt">Preparando el laberinto</p></div></div>
<div class="cartel" id="intro" hidden><div class="carta sin-fondo"><h1>¡A RECOGER EL ORO!</h1><p>Junta las 36 monedas y escapa por la puerta</p></div></div>
<div class="cartel" id="final" hidden>
  <div class="carta">
    <h1 id="finTitulo">Juego terminado</h1>
    <small>PUNTAJE FINAL</small>
    <div class="grande" id="finPuntaje">0</div>
    <p id="finStats"></p>
    <button id="btnOtra" class="boton">REINTENTAR (R)</button>
  </div>
</div>

<script type="module" src="laberinto.js"></script>
</body>
</html>
